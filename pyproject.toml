[project]
name = "rjpark671-github-io"
version = "0.0.1"
description = "Initial Website for Richard Park GitHub"
authors = [
    {name = "Richard Park",email = "rjpark@bu.edu"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy (>=2.5.3,<3.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "matplot (>=0.1.9,<0.2.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "plotly (>=7.0.0,<8.0.0)"
]

[tool.poetry]
packages = [{include = "rjpark671"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
